<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Studio — Réplicas de Diseño Gráfico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-workspace: #0f1115;
      --panel-bg: rgba(22, 27, 34, 0.88);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --text: #e6edf3;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-workspace);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Toolbar */
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-tag {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-color);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: #0ea5e9;
      color: #fff;
      box-shadow: 0 2px 10px rgba(14, 165, 233, 0.35);
    }

    .btn-primary:hover {
      background: #38bdf8;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.5);
      transform: translateY(-1px);
    }

    /* Workspace */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 20px;
      background: radial-gradient(circle at 50% 25%, #181c24 0%, #0c0e12 100%);
    }

    .canvas-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
    }

    .poster-frame {
      width: 580px;
      max-width: 92vw;
      border-radius: 6px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: #f7f7f7;
      transition: all 0.25s ease;
    }

    .poster-frame object {
      width: 100%;
      height: 100%;
      display: block;
    }

    .specs-bar {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .specs-item span {
      color: var(--text);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #238636;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-tag">Vector Studio</span>
      <h1>Estudio de Réplicas Vectoriales</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-camera" onclick="switchPoster('camera')">📷 Cámara y Paisajes Radiales</button>
      <button class="tab-btn" id="tab-edge" onclick="switchPoster('edge')">🛶 The Edge (Canoa 3D)</button>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="btn-png">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        Descargar PNG (Alta Resolución)
      </button>
      <a class="btn btn-primary" id="btn-svg" href="/poster_camera_landscapes.svg" download="poster_camera_landscapes.svg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar SVG Vectorial
      </a>
    </div>
  </header>

  <main>
    <div class="canvas-container">
      <div class="poster-frame" id="posterFrame" style="aspect-ratio: 1152 / 2048;">
        <object id="svgObject" data="/poster_camera_landscapes.svg?v=3" type="image/svg+xml"></object>
      </div>

      <div class="specs-bar" id="specsBar">
        <div class="specs-item">Dimensiones: <span>1152 × 2048 px (2K)</span></div>
        <div class="specs-item">Formato: <span>SVG con Capas y Textos Editables</span></div>
        <div class="specs-item">Compatible con: <span>Figma / Illustrator / Inkscape</span></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Archivo descargado con éxito</div>

  <script>
    let currentPoster = 'camera';
    const svgObject = document.getElementById('svgObject');
    const btnSvg = document.getElementById('btn-svg');
    const btnPng = document.getElementById('btn-png');
    const posterFrame = document.getElementById('posterFrame');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function switchPoster(type) {
      currentPoster = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (type === 'camera') {
        document.getElementById('tab-camera').classList.add('active');
        svgObject.data = '/poster_camera_landscapes.svg?t=' + Date.now();
        btnSvg.href = '/poster_camera_landscapes.svg';
        btnSvg.download = 'poster_camera_landscapes.svg';
        posterFrame.style.aspectRatio = '1000 / 1600';
      } else {
        document.getElementById('tab-edge').classList.add('active');
        svgObject.data = '/poster_the_edge.svg?t=' + Date.now();
        btnSvg.href = '/poster_the_edge.svg';
        btnSvg.download = 'poster_the_edge.svg';
        posterFrame.style.aspectRatio = '1000 / 1350';
      }
      showToast('Cambiando a ' + (type === 'camera' ? 'Cámara y Paisajes' : 'The Edge'));
    }

    btnSvg.addEventListener('click', () => {
      showToast('Descargando archivo SVG vectorial...');
    });

    btnPng.addEventListener('click', async () => {
      showToast('Renderizando imagen PNG en alta definición...');
      try {
        const fileUrl = btnSvg.href;
        const resp = await fetch(fileUrl);
        const svgText = await resp.text();

        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          if (currentPoster === 'camera') {
            canvas.width = 2000;
            canvas.height = 3200;
          } else {
            canvas.width = 2000;
            canvas.height = 2700;
          }
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(blobURL);

          const a = document.createElement('a');
          a.download = (currentPoster === 'camera' ? 'camera_landscapes' : 'the_edge') + '_highres.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('¡PNG descargado con éxito!');
        };
        img.src = blobURL;
      } catch (err) {
        console.error(err);
        alert('Error al generar PNG: ' + err.message);
      }
    });
  </script>
</body>
</html>
